<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer Journey Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='black'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #050505;
      --paper: #f7f7f4;
      --paper-soft: #fbfbf8;
      --control-surface: #ffffff;
      --rail: #bfc0c2;
      --rail-dark: #aeb0b3;
      --line: #050505;
      --drop: rgba(0, 0, 0, 0.055);
      --focus: #2b6ff3;
      --shadow: rgba(0, 0, 0, 0.11);
      --texture-line: rgba(0, 0, 0, 0.018);
      --canvas-bg-start: #ffffff;
      --canvas-bg-end: #f7f7f4;
      --stage-fill: #000000;
      --stage-text: #ffffff;
      --touchpoint-bg: #ffffff;
      --touchpoint-likely-bg: #ffe2a6;
      --touchpoint-best-bg: #cfe8ff;
      --touchpoint-both-bg: #cdf2d4;
      --touchpoint-flagged-ink: #050505;
      --modal-backdrop: rgba(5, 5, 5, 0.42);
      --sans: "Avenir Next", "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
      --stage-row: 74px;
      --goal-row: 58px;
      --question-row: 162px;
      --internal-row: minmax(476px, auto);
      --external-row: minmax(244px, auto);
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --ink: #f4f1e8;
      --paper: #111213;
      --paper-soft: #232427;
      --control-surface: #1b1c1f;
      --rail: #4e5258;
      --rail-dark: #34373d;
      --line: #f4f1e8;
      --drop: rgba(255, 255, 255, 0.08);
      --focus: #8eb5ff;
      --shadow: rgba(0, 0, 0, 0.36);
      --texture-line: rgba(255, 255, 255, 0.035);
      --canvas-bg-start: #191a1d;
      --canvas-bg-end: #101113;
      --stage-fill: #f4f1e8;
      --stage-text: #050505;
      --touchpoint-bg: #1f2023;
      --touchpoint-likely-bg: #ffe2a6;
      --touchpoint-best-bg: #cfe8ff;
      --touchpoint-both-bg: #cdf2d4;
      --touchpoint-flagged-ink: #050505;
      --modal-backdrop: rgba(0, 0, 0, 0.66);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      line-height: 1.16;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .app-shell {
      min-height: 100vh;
      padding: 18px 18px 40px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--canvas-bg-start) 88%, transparent), color-mix(in srgb, var(--canvas-bg-end) 96%, transparent)),
        repeating-linear-gradient(0deg, var(--texture-line) 0 1px, transparent 1px 5px);
      transition: background 180ms ease, color 180ms ease;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      max-width: 1680px;
      margin: 0 auto 14px;
    }

    .toolbar h1 {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.3em;
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .persona-value {
      appearance: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: text;
      font: inherit;
      font-weight: 900;
      line-height: 1;
      text-align: left;
    }

    .persona-value:hover {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    .persona-editor {
      width: 260px;
      min-height: 34px;
      padding: 4px 8px;
      border: 2px solid var(--line);
      border-radius: 7px;
      background: var(--control-surface);
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      line-height: 1;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-button,
    .add-button {
      border: 2px solid var(--line);
      background: var(--control-surface);
      color: var(--ink);
      cursor: pointer;
      font-weight: 900;
      box-shadow: 0 2px 0 var(--line);
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .control-button {
      min-height: 38px;
      padding: 7px 16px 8px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .control-button:hover,
    .add-button:hover {
      background: var(--paper-soft);
      transform: translateY(-1px);
      box-shadow: 0 3px 0 var(--line);
    }

    .theme-toggle {
      display: inline-grid;
      grid-template-columns: 28px 28px;
      gap: 2px;
      align-items: center;
      min-height: 38px;
      padding: 4px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--control-surface);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 2px 0 var(--line);
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .theme-toggle:hover {
      background: var(--paper-soft);
      transform: translateY(-1px);
      box-shadow: 0 3px 0 var(--line);
    }

    .theme-toggle:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 var(--line);
    }

    .theme-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 26px;
      border-radius: 999px;
      color: var(--ink);
      opacity: 0.62;
      transition: background 160ms ease, color 160ms ease, opacity 160ms ease;
    }

    .theme-icon svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    body:not([data-theme="dark"]) .theme-icon.sun,
    body[data-theme="dark"] .theme-icon.moon {
      background: var(--line);
      color: var(--paper);
      opacity: 1;
    }

    .control-button:active,
    .add-button:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 var(--line);
    }

    .status {
      min-width: 118px;
      color: color-mix(in srgb, var(--ink) 78%, var(--paper));
      font-size: 13px;
      font-weight: 800;
      text-align: right;
      text-transform: uppercase;
    }

    body.is-rendering-png .toolbar-actions,
    body.is-rendering-png .add-button,
    body.is-rendering-png .status {
      visibility: hidden;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .map-viewport {
      overflow-x: auto;
      padding: 0 0 18px;
    }

    .map-grid {
      position: relative;
      display: grid;
      grid-template-columns: 210px repeat(5, minmax(190px, 1fr));
      grid-template-rows: var(--stage-row) var(--goal-row) var(--question-row) var(--internal-row) var(--external-row);
      column-gap: 30px;
      row-gap: 18px;
      align-items: start;
      min-width: 1580px;
      max-width: 1680px;
      margin: 0 auto;
      padding: 0;
    }

    .side-rail {
      position: relative;
      z-index: 0;
      grid-column: 1;
      grid-row: 1 / 6;
      align-self: stretch;
      min-height: 100%;
      border: 3px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(90deg, var(--rail), var(--rail-dark));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .delete-hint {
      position: sticky;
      top: 18px;
      margin: 18px auto 0;
      width: fit-content;
      max-width: 150px;
      padding: 8px 10px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--control-surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 140ms ease, transform 140ms ease;
      pointer-events: none;
    }

    body.is-dragging .delete-hint {
      opacity: 1;
      transform: translateY(0);
    }

    body.delete-active .side-rail {
      background: linear-gradient(90deg, #d3d4d6, #b9bbbf);
      outline: 4px solid rgba(0, 0, 0, 0.13);
      outline-offset: -8px;
    }

    .side-label {
      position: relative;
      z-index: 4;
      grid-column: 1;
      padding: 0 24px;
      font-size: 22px;
      font-weight: 950;
      line-height: 1.05;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .stage-label,
    .goals-label {
      align-self: center;
    }

    .questions-label {
      padding-top: 22px;
    }

    .internal-label {
      display: flex;
      align-items: stretch;
      gap: 12px;
      flex-direction: column;
      padding-top: 50px;
    }

    .external-label {
      display: flex;
      align-items: stretch;
      gap: 12px;
      flex-direction: column;
      padding-top: 52px;
    }

    .add-button {
      display: inline-grid;
      place-items: center;
      align-self: flex-end;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 24px;
      line-height: 1;
    }

    .stage-pill {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      width: 100%;
      height: 72px;
      padding: 0 34px 1px 30px;
      color: var(--stage-text);
      background: var(--stage-fill);
      clip-path: polygon(0 0, calc(100% - 48px) 0, 100% 50%, calc(100% - 48px) 100%, 0 100%);
      border-radius: 8px 0 0 8px;
      filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.1));
      font-size: 30px;
      font-weight: 950;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .goal-cell,
    .question-cell {
      position: relative;
      z-index: 2;
      font-size: 21px;
      line-height: 1.12;
      white-space: pre-line;
    }

    .goal-cell {
      padding-top: 6px;
      font-weight: 500;
    }

    .goal-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }

    .question-cell {
      padding-top: 2px;
    }

    .question-cell ol {
      margin: 0;
      padding-left: 24px;
    }

    .question-cell li {
      margin: 0 0 4px;
      padding-left: 3px;
    }

    .question-cell li::marker {
      font-weight: 900;
    }

    .question-button {
      display: inline;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      line-height: inherit;
      text-align: left;
      white-space: pre-line;
    }

    .goal-cell .question-button {
      font-weight: 500;
    }

    .question-button:hover {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .question-button:focus {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .journey-divider {
      position: relative;
      z-index: 5;
      grid-column: 1 / -1;
      grid-row: 5;
      height: 28px;
      margin-top: -21px;
      pointer-events: none;
    }

    .journey-divider::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 22px;
      right: 42px;
      border-top: 5px dashed var(--line);
      border-radius: 999px;
    }

    .journey-divider::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 50px solid var(--line);
    }

    .touch-cell {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 8px 0 12px;
      border: 1px solid transparent;
      border-radius: 9px;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .touch-cell.internal-cell {
      min-height: 452px;
    }

    .touch-cell.external-cell {
      min-height: 224px;
      padding-top: 50px;
    }

    .touch-cell.drag-over {
      border-color: rgba(0, 0, 0, 0.14);
      background: var(--drop);
    }

    .touch-cell.empty::after {
      content: "";
      display: block;
      width: 100%;
      min-height: 32px;
      border-radius: 8px;
    }

    .touchpoint {
      display: block;
      max-width: 100%;
      width: fit-content;
      min-height: 36px;
      padding: 8px 13px 7px;
      border: 1.8px solid var(--line);
      border-radius: 8px;
      background: var(--touchpoint-bg);
      color: var(--ink);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
      cursor: grab;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.08;
      overflow-wrap: anywhere;
      white-space: pre-line;
      user-select: none;
      transition: background 120ms ease, transform 120ms ease, box-shadow 120ms ease;
    }

    .touchpoint:hover {
      background: var(--paper-soft);
      box-shadow: 0 3px 9px var(--shadow);
      transform: translateY(-1px);
    }

    .touchpoint.is-likely {
      background: var(--touchpoint-likely-bg);
      color: var(--touchpoint-flagged-ink);
    }

    .touchpoint.is-best {
      background: var(--touchpoint-best-bg);
      color: var(--touchpoint-flagged-ink);
    }

    .touchpoint.is-best.is-likely {
      background: var(--touchpoint-both-bg);
      color: var(--touchpoint-flagged-ink);
    }

    .touchpoint:focus {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .touchpoint:active {
      cursor: grabbing;
    }

    .touchpoint.dragging {
      opacity: 0.3;
      transform: scale(0.99);
    }

    .touchpoint.flash-added {
      animation: flash-added 1s ease-out;
    }

    .touchpoint.flash-moved {
      animation: flash-moved 1s ease-out;
    }

    .touchpoint.editing {
      min-width: 168px;
      cursor: text;
      user-select: text;
    }

    .touchpoint-editor {
      display: block;
      width: min(270px, 100%);
      min-width: 150px;
      min-height: 28px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      line-height: 1.08;
      resize: vertical;
    }

    .touchpoint.is-best .touchpoint-editor,
    .touchpoint.is-likely .touchpoint-editor {
      color: var(--touchpoint-flagged-ink);
    }

    .drop-marker {
      width: min(188px, 86%);
      height: 8px;
      margin: 1px 0;
      border-radius: 999px;
      background: #000;
      opacity: 0.78;
    }

    @keyframes flash-added {
      0% {
        background: #d7ecff;
        box-shadow: 0 0 0 4px rgba(129, 193, 255, 0.34);
      }

      100% {
        background: var(--touchpoint-bg);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
      }
    }

    @keyframes flash-moved {
      0% {
        background: #d9f6dc;
        box-shadow: 0 0 0 4px rgba(118, 205, 133, 0.34);
      }

      100% {
        background: var(--touchpoint-bg);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
      }
    }

    .question-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--modal-backdrop);
    }

    .question-modal-backdrop[hidden] {
      display: none;
    }

    .question-modal {
      position: relative;
      width: min(640px, calc(100vw - 36px));
      max-height: calc(100vh - 48px);
      overflow: auto;
      padding: 28px 30px 30px;
      border: 3px solid var(--line);
      border-radius: 8px;
      background: var(--control-surface);
      color: var(--ink);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }

    .question-modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 2px solid var(--line);
      border-radius: 50%;
      background: var(--control-surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 23px;
      font-weight: 900;
      line-height: 1;
    }

    .question-modal-kicker,
    .question-modal-answer-label {
      margin: 0;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .question-modal-question {
      margin: 10px 42px 22px 0;
      font-size: 28px;
      font-weight: 950;
      line-height: 1.08;
      white-space: pre-line;
    }

    .question-modal-answer {
      margin: 8px 0 0;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.35;
      white-space: pre-line;
    }

    @media (max-width: 900px) {
      .app-shell {
        padding: 14px 12px 28px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar-actions {
        justify-content: flex-start;
      }

      .status {
        text-align: left;
      }
    }

    @media print {
      .app-shell {
        padding: 0;
        background: #fff;
      }

      .toolbar {
        display: none;
      }

      .map-viewport {
        overflow: visible;
      }

      .map-grid {
        transform: scale(0.72);
        transform-origin: top left;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="toolbar" aria-label="Map controls">
      <h1>
        <span>Developer Journey Map - Persona:</span>
        <button class="persona-value" id="personaValue" type="button" aria-label="Edit persona">Generic Developer</button>
      </h1>
      <div class="toolbar-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle dark/light mode">
          <span class="theme-icon sun" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"></path>
            </svg>
          </span>
          <span class="theme-icon moon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M21 14.7A7.8 7.8 0 0 1 9.3 3a8.6 8.6 0 1 0 11.7 11.7z"></path>
            </svg>
          </span>
        </button>
        <button class="control-button" id="importButton" type="button">Import</button>
        <button class="control-button" id="exportButton" type="button">Export</button>
        <button class="control-button" id="downloadPngButton" type="button">Download PNG</button>
        <button class="control-button" id="resetButton" type="button">Reset</button>
        <input class="visually-hidden" id="importFile" type="file" accept=".json,application/json">
        <span class="status" id="status" role="status" aria-live="polite">Ready</span>
      </div>
    </header>

    <main class="map-viewport">
      <section class="map-grid" id="mapGrid" aria-label="Developer journey map">
        <div class="side-rail delete-drop-target" id="deleteZone" aria-hidden="true">
          <div class="delete-hint">Drop to delete</div>
        </div>
        <div class="side-label stage-label delete-drop-target" style="grid-row: 1;">Stage</div>
        <div class="side-label goals-label delete-drop-target" style="grid-row: 2;">Goals/Needs</div>
        <div class="side-label questions-label delete-drop-target" style="grid-row: 3;">Questions</div>
        <div class="side-label internal-label delete-drop-target" style="grid-row: 4;">
          <button class="add-button" id="addInternalButton" type="button" aria-label="Add internal touchpoint" title="Add internal touchpoint">+</button>
          <span>Internal<br>Touchpoints</span>
        </div>
        <div class="side-label external-label delete-drop-target" style="grid-row: 5;">
          <button class="add-button" id="addExternalButton" type="button" aria-label="Add external touchpoint" title="Add external touchpoint">+</button>
          <span>External<br>Touchpoints</span>
        </div>
        <div class="journey-divider" aria-hidden="true"></div>
      </section>
    </main>
  </div>

  <div class="question-modal-backdrop" id="questionModal" hidden>
    <section class="question-modal" role="dialog" aria-modal="true" aria-labelledby="questionModalQuestion" aria-describedby="questionModalAnswer" tabindex="-1">
      <button class="question-modal-close" id="questionModalClose" type="button" aria-label="Close question answer">x</button>
      <p class="question-modal-kicker" id="questionModalMeta">Question</p>
      <h2 class="question-modal-question" id="questionModalQuestion"></h2>
      <p class="question-modal-answer-label">Answer</p>
      <p class="question-modal-answer" id="questionModalAnswer"></p>
    </section>
  </div>

  <script type="application/schema+json" id="journey-map-json-schema">
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://example.local/developer-journey-map.schema.json",
  "title": "Developer Journey Map State",
  "type": "object",
  "additionalProperties": false,
  "required": ["schemaVersion", "persona", "nextTouchpointNumber", "questions", "touchpoints"],
  "properties": {
    "schemaVersion": {
      "type": "integer",
      "const": 2
    },
    "persona": {
      "type": "string",
      "minLength": 1,
      "maxLength": 120
    },
    "nextTouchpointNumber": {
      "type": "integer",
      "minimum": 1
    },
    "questions": {
      "type": "array",
      "maxItems": 200,

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "developerJourneyMap.v1";
      const THEME_STORAGE_KEY = "developerJourneyMap.theme.v1";
      const STAGES = [
        { id: "discover", label: "Discover" },
        { id: "evaluate", label: "Evaluate" },
        { id: "learn", label: "Learn" },
        { id: "build", label: "Build" },
        { id: "scale", label: "Scale" }
      ];

      const SECTION_IDS = ["internal", "external"];
      const STAGE_IDS = STAGES.map((stage) => stage.id);
      const schema = JSON.parse(document.getElementById("journey-map-json-schema").textContent);
      const DEFAULT_STATE = JSON.parse(document.getElementById("default-journey-map-json").textContent);

      const mapGrid = document.getElementById("mapGrid");
      const statusEl = document.getElementById("status");
      const themeToggle = document.getElementById("themeToggle");
      const personaValue = document.getElementById("personaValue");
      const importButton = document.getElementById("importButton");
      const exportButton = document.getElementById("exportButton");
      const downloadPngButton = document.getElementById("downloadPngButton");
      const resetButton = document.getElementById("resetButton");
      const importFile = document.getElementById("importFile");
      const addInternalButton = document.getElementById("addInternalButton");
      const addExternalButton = document.getElementById("addExternalButton");
      const questionModal = document.getElementById("questionModal");
      const questionModalDialog = questionModal.querySelector(".question-modal");
      const questionModalClose = document.getElementById("questionModalClose");
      const questionModalMeta = document.getElementById("questionModalMeta");
      const questionModalQuestion = document.getElementById("questionModalQuestion");
      const questionModalAnswer = document.getElementById("questionModalAnswer");

      let state = null;
      let draggedId = null;
      let dropMarker = null;
      let statusTimer = null;
      let flashTouchpointId = null;
      let flashTouchpointKind = null;
      let lastQuestionTrigger = null;

      window.DEVELOPER_JOURNEY_MAP_SCHEMA = schema;
      window.getDeveloperJourneyMapData = () => cloneState(state);

      applyTheme(loadTheme());
      renderStaticRows();
      state = loadState();
      renderPersona();
      renderQuestionRows();
      renderTouchpoints();
      attachChromeEvents();
      saveState("Ready");

      function renderStaticRows() {
        STAGES.forEach((stage, stageIndex) => {
          const column = String(stageIndex + 2);

          const stagePill = document.createElement("div");
          stagePill.className = "stage-pill";
          stagePill.style.gridColumn = column;
          stagePill.style.gridRow = "1";
          stagePill.textContent = stage.label;
          mapGrid.appendChild(stagePill);

          const goalCell = document.createElement("div");
          goalCell.className = "goal-cell";
          goalCell.style.gridColumn = column;
          goalCell.style.gridRow = "2";
          goalCell.dataset.stage = stage.id;
          mapGrid.appendChild(goalCell);

          const questionCell = document.createElement("div");
          questionCell.className = "question-cell";
          questionCell.style.gridColumn = column;
          questionCell.style.gridRow = "3";
          questionCell.dataset.stage = stage.id;
          mapGrid.appendChild(questionCell);

          SECTION_IDS.forEach((section) => {
            const touchCell = document.createElement("div");
            touchCell.className = `touch-cell ${section}-cell`;
            touchCell.style.gridColumn = column;
            touchCell.style.gridRow = section === "internal" ? "4" : "5";
            touchCell.dataset.section = section;
            touchCell.dataset.stage = stage.id;
            touchCell.setAttribute("aria-label", `${section} touchpoints for ${stage.label}`);
            touchCell.addEventListener("dragover", handleCellDragOver);
            touchCell.addEventListener("drop", handleCellDrop);
            touchCell.addEventListener("dragleave", handleCellDragLeave);
            mapGrid.appendChild(touchCell);
          });
        });
      }

      function renderQuestionRows() {
        STAGES.forEach((stage) => {
          const goalCell = document.querySelector(`.goal-cell[data-stage="${stage.id}"]`);
          const questionCell = document.querySelector(`.question-cell[data-stage="${stage.id}"]`);
          if (!goalCell || !questionCell) {
            return;
          }

          goalCell.replaceChildren();
          const goalList = document.createElement("div");
          goalList.className = "goal-list";
          getQuestions(true, stage.id).forEach((question) => {
            goalList.appendChild(createQuestionButton(question));
          });
          goalCell.appendChild(goalList);

          questionCell.replaceChildren();
          const list = document.createElement("ol");
          getQuestions(false, stage.id).forEach((question) => {
            const item = document.createElement("li");
            item.appendChild(createQuestionButton(question));
            list.appendChild(item);
          });
          questionCell.appendChild(list);
        });
      }

      function getQuestions(isGoal, stage) {
        return state.questions
          .filter((question) => question.isGoal === isGoal && question.stage === stage)
          .sort((a, b) => a.order - b.order || a.q.localeCompare(b.q));
      }

      function createQuestionButton(question) {
        const button = document.createElement("button");
        button.className = "question-button";
        button.type = "button";
        button.textContent = question.q;
        button.dataset.stage = question.stage;
        button.dataset.isGoal = String(question.isGoal);
        button.setAttribute("aria-label", `Open answer: ${question.q.replace(/\s+/g, " ")}`);
        button.addEventListener("click", () => openQuestionModal(question, button));
        return button;
      }

      function attachChromeEvents() {
        themeToggle.addEventListener("click", toggleTheme);
        personaValue.addEventListener("click", startEditingPersona);
        addInternalButton.addEventListener("click", () => addTouchpoint("internal"));
        addExternalButton.addEventListener("click", () => addTouchpoint("external"));
        importButton.addEventListener("click", () => importFile.click());
        importFile.addEventListener("change", importFromFile);
        exportButton.addEventListener("click", exportToFile);
        downloadPngButton.addEventListener("click", downloadPng);
        resetButton.addEventListener("click", resetToDefault);

        document.querySelectorAll(".delete-drop-target").forEach((target) => {
          target.addEventListener("dragover", handleDeleteDragOver);
          target.addEventListener("drop", handleDeleteDrop);
          target.addEventListener("dragleave", handleDeleteDragLeave);
        });

        document.addEventListener("dragover", handleDocumentDragOver, true);
        document.addEventListener("drop", handleDocumentDrop, true);
        questionModal.addEventListener("click", (event) => {
          if (event.target === questionModal) {
            closeQuestionModal();
          }
        });
        questionModalClose.addEventListener("click", closeQuestionModal);
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !questionModal.hidden) {
            closeQuestionModal();
          }
        });
      }

      function loadTheme() {
        try {
          return window.localStorage.getItem(THEME_STORAGE_KEY) === "dark" ? "dark" : "light";
        } catch (error) {
          return "light";
        }
      }

      function toggleTheme() {
        const nextTheme = document.body.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(nextTheme);
        try {
          window.localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
        } catch (error) {
          setStatus("Storage blocked");
        }
      }

      function applyTheme(theme) {
        const normalizedTheme = theme === "dark" ? "dark" : "light";
        document.body.dataset.theme = normalizedTheme;
        themeToggle.setAttribute("aria-pressed", String(normalizedTheme === "dark"));
        themeToggle.setAttribute("aria-label", normalizedTheme === "dark" ? "Switch to light mode" : "Switch to dark mode");
      }

      function openQuestionModal(question, trigger) {
        lastQuestionTrigger = trigger || document.activeElement;
        const stageLabel = getStageLabel(question.stage);
        questionModalMeta.textContent = `${stageLabel} / ${question.isGoal ? "Goal" : "Question"}`;
        questionModalQuestion.textContent = question.q;
        questionModalAnswer.textContent = question.a || "No answer provided.";
        questionModal.hidden = false;
        document.body.classList.add("modal-open");
        window.requestAnimationFrame(() => questionModalDialog.focus());
      }

      function closeQuestionModal() {
        questionModal.hidden = true;
        document.body.classList.remove("modal-open");
        if (lastQuestionTrigger && typeof lastQuestionTrigger.focus === "function") {
          lastQuestionTrigger.focus();
        }
        lastQuestionTrigger = null;
      }

      function getStageLabel(stageId) {
        const stage = STAGES.find((candidate) => candidate.id === stageId);
        return stage ? stage.label : stageId;
      }

      function renderPersona() {
        personaValue.textContent = state.persona;
        personaValue.setAttribute("aria-label", `Edit persona: ${state.persona}`);
      }

      function loadState() {
        const raw = readLocalStorage();
        if (!raw) {
          return cloneState(DEFAULT_STATE);
        }

        try {
          const parsed = JSON.parse(raw);
          const result = validateState(parsed);
          if (result.valid) {
            return result.value;
          }
          setStatus("Storage reset");
          return cloneState(DEFAULT_STATE);
        } catch (error) {
          setStatus("Storage reset");
          return cloneState(DEFAULT_STATE);
        }
      }

      function readLocalStorage() {
        try {
          return window.localStorage.getItem(STORAGE_KEY);
        } catch (error) {
          setStatus("Storage blocked");
          return null;
        }
      }

      function saveState(message) {
        normalizeAllOrders();
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state, null, 2));
          setStatus(message || "Saved");
        } catch (error) {
          setStatus("Storage blocked");
        }
      }

      function validateState(input) {
        const errors = [];

        if (!input || typeof input !== "object" || Array.isArray(input)) {
          errors.push("Root must be an object.");
        }

        if (errors.length === 0) {
          const allowedRootKeys = ["schemaVersion", "persona", "nextTouchpointNumber", "questions", "touchpoints"];
          const unknownKey = Object.keys(input).find((key) => !allowedRootKeys.includes(key));
          if (unknownKey) {
            errors.push(`Root has unsupported key "${unknownKey}".`);
          }
        }

        if (errors.length === 0 && input.schemaVersion !== 2) {
          errors.push("schemaVersion must be 2.");
        }

        if (errors.length === 0 && (typeof input.persona !== "string" || input.persona.trim().length === 0 || input.persona.length > 120)) {
          errors.push("persona must be 1 to 120 characters.");
        }

        if (errors.length === 0 && (!Number.isInteger(input.nextTouchpointNumber) || input.nextTouchpointNumber < 1)) {
          errors.push("nextTouchpointNumber must be a positive integer.");
        }

        const questionSource = input && Array.isArray(input.questions) ? input.questions : cloneState(DEFAULT_STATE.questions);
        if (errors.length === 0 && input.questions !== undefined && (!Array.isArray(input.questions) || input.questions.length > 200)) {
          errors.push("questions must be an array with 200 items or fewer.");
        }

        if (errors.length === 0 && (!Array.isArray(input.touchpoints) || input.touchpoints.length > 500)) {
          errors.push("touchpoints must be an array with 500 items or fewer.");
        }

        const ids = new Set();
        const normalizedQuestions = [];
        const normalizedTouchpoints = [];

        if (errors.length === 0) {
          questionSource.forEach((question, index) => {
            if (!question || typeof question !== "object" || Array.isArray(question)) {
              errors.push(`questions[${index}] must be an object.`);
              return;
            }

            const allowedKeys = ["q", "a", "isGoal", "stage", "order"];
            const unknownKey = Object.keys(question).find((key) => !allowedKeys.includes(key));
            if (unknownKey) {
              errors.push(`questions[${index}] has unsupported key "${unknownKey}".`);
            }

            if (typeof question.q !== "string" || question.q.trim().length === 0 || question.q.length > 300) {
              errors.push(`questions[${index}].q must be 1 to 300 characters.`);
            }

            if (typeof question.a !== "string" || question.a.length > 4000) {
              errors.push(`questions[${index}].a must be a string with 4000 characters or fewer.`);
            }

            if (typeof question.isGoal !== "boolean") {
              errors.push(`questions[${index}].isGoal must be a boolean.`);
            }

            if (!STAGE_IDS.includes(question.stage)) {
              errors.push(`questions[${index}].stage is not a known stage.`);
            }

            if (!Number.isInteger(question.order) || question.order < 0) {
              errors.push(`questions[${index}].order must be a non-negative integer.`);
            }

            normalizedQuestions.push({
              q: String(question.q || "").trim().replace(/\r\n/g, "\n"),
              a: String(question.a || "").trim().replace(/\r\n/g, "\n"),
              isGoal: Boolean(question.isGoal),
              stage: question.stage,
              order: Number(question.order)
            });
          });

          input.touchpoints.forEach((touchpoint, index) => {
            if (!touchpoint || typeof touchpoint !== "object" || Array.isArray(touchpoint)) {
              errors.push(`touchpoints[${index}] must be an object.`);
              return;
            }

            const allowedKeys = ["id", "section", "stage", "text", "order", "best", "likely"];
            const unknownKey = Object.keys(touchpoint).find((key) => !allowedKeys.includes(key));
            if (unknownKey) {
              errors.push(`touchpoints[${index}] has unsupported key "${unknownKey}".`);
            }

            if (typeof touchpoint.id !== "string" || touchpoint.id.trim().length === 0 || touchpoint.id.length > 120) {
              errors.push(`touchpoints[${index}].id must be a non-empty string.`);
            } else if (ids.has(touchpoint.id)) {
              errors.push(`touchpoints[${index}].id must be unique.`);
            } else {
              ids.add(touchpoint.id);
            }

            if (!SECTION_IDS.includes(touchpoint.section)) {
              errors.push(`touchpoints[${index}].section must be internal or external.`);
            }

            if (!STAGE_IDS.includes(touchpoint.stage)) {
              errors.push(`touchpoints[${index}].stage is not a known stage.`);
            }

            if (typeof touchpoint.text !== "string" || touchpoint.text.trim().length === 0 || touchpoint.text.length > 240) {
              errors.push(`touchpoints[${index}].text must be 1 to 240 characters.`);
            }

            if (!Number.isInteger(touchpoint.order) || touchpoint.order < 0) {
              errors.push(`touchpoints[${index}].order must be a non-negative integer.`);
            }

            if (touchpoint.best !== undefined && typeof touchpoint.best !== "boolean") {
              errors.push(`touchpoints[${index}].best must be a boolean when present.`);
            }

            if (touchpoint.likely !== undefined && typeof touchpoint.likely !== "boolean") {
              errors.push(`touchpoints[${index}].likely must be a boolean when present.`);
            }

            const normalizedTouchpoint = {
              id: String(touchpoint.id),
              section: touchpoint.section,
              stage: touchpoint.stage,
              text: String(touchpoint.text).trim(),
              order: Number(touchpoint.order)
            };

            if (touchpoint.best === true) {
              normalizedTouchpoint.best = true;
            }

            if (touchpoint.likely === true) {
              normalizedTouchpoint.likely = true;
            }

            normalizedTouchpoints.push(normalizedTouchpoint);
          });
        }

        if (errors.length > 0) {
          return {
            valid: false,
            errors
          };
        }

        const normalized = {
          schemaVersion: 2,
          persona: input.persona.trim(),
          nextTouchpointNumber: getNextTouchpointNumber(input.nextTouchpointNumber, normalizedTouchpoints),
          questions: normalizedQuestions,
          touchpoints: normalizedTouchpoints
        };

        normalizeQuestionOrders(normalized.questions);
        normalizeOrders(normalized.touchpoints);

        return {
          valid: true,
          value: normalized
        };
      }

      function getNextTouchpointNumber(importedNext, touchpoints) {
        const highestGeneratedNumber = touchpoints.reduce((highest, touchpoint) => {
          const match = touchpoint.text.match(/^Touchpoint\s+(\d+)$/i);
          return match ? Math.max(highest, Number(match[1])) : highest;
        }, 0);

        return Math.max(importedNext, highestGeneratedNumber + 1, 1);
      }

      function normalizeAllOrders() {
        normalizeQuestionOrders(state.questions);
        normalizeOrders(state.touchpoints);
      }

      function normalizeQuestionOrders(questions) {
        [true, false].forEach((isGoal) => {
          STAGE_IDS.forEach((stage) => {
            questions
              .filter((question) => question.isGoal === isGoal && question.stage === stage)
              .sort((a, b) => a.order - b.order || a.q.localeCompare(b.q))
              .forEach((question, index) => {
                question.order = index;
              });
          });
        });
      }

      function normalizeOrders(touchpoints) {
        SECTION_IDS.forEach((section) => {
          STAGE_IDS.forEach((stage) => {
            touchpoints
              .filter((touchpoint) => touchpoint.section === section && touchpoint.stage === stage)
              .sort((a, b) => a.order - b.order || a.text.localeCompare(b.text))
              .forEach((touchpoint, index) => {
                touchpoint.order = index;
              });
          });
        });
      }

      function renderTouchpoints() {
        const activeFlashId = flashTouchpointId;
        const activeFlashKind = flashTouchpointKind;
        document.querySelectorAll(".touch-cell").forEach((cell) => {
          cell.replaceChildren();
          const touchpoints = getTouchpoints(cell.dataset.section, cell.dataset.stage);
          cell.classList.toggle("empty", touchpoints.length === 0);
          touchpoints.forEach((touchpoint) => {
            cell.appendChild(createTouchpointElement(touchpoint, activeFlashId, activeFlashKind));
          });
        });
        flashTouchpointId = null;
        flashTouchpointKind = null;
      }

      function getTouchpoints(section, stage) {
        return state.touchpoints
          .filter((touchpoint) => touchpoint.section === section && touchpoint.stage === stage)
          .sort((a, b) => a.order - b.order);
      }

      function createTouchpointElement(touchpoint, activeFlashId, activeFlashKind) {
        const element = document.createElement("div");
        element.className = "touchpoint";
        element.draggable = true;
        element.tabIndex = 0;
        element.dataset.id = touchpoint.id;
        element.setAttribute("role", "button");
        element.setAttribute("aria-label", touchpoint.text.replace(/\s+/g, " "));
        element.textContent = touchpoint.text;

        if (touchpoint.best) {
          element.classList.add("is-best");
          element.dataset.best = "true";
        }

        if (touchpoint.likely) {
          element.classList.add("is-likely");
          element.dataset.likely = "true";
        }

        if (touchpoint.id === activeFlashId && activeFlashKind) {
          element.classList.add(`flash-${activeFlashKind}`);
          element.addEventListener("animationend", () => {
            element.classList.remove(`flash-${activeFlashKind}`);
          }, { once: true });
        }

        element.addEventListener("dragstart", handleDragStart);
        element.addEventListener("dragend", handleDragEnd);
        element.addEventListener("dblclick", () => startEditing(element, touchpoint.id));
        element.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            startEditing(element, touchpoint.id);
          }
        });

        return element;
      }

      function handleDragStart(event) {
        const element = event.currentTarget;
        if (element.classList.contains("editing")) {
          event.preventDefault();
          return;
        }

        draggedId = element.dataset.id;
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", draggedId);
        window.requestAnimationFrame(() => {
          element.classList.add("dragging");
          document.body.classList.add("is-dragging");
        });
      }

      function handleDragEnd() {
        draggedId = null;
        clearDropMarker();
        document.querySelectorAll(".touch-cell.drag-over").forEach((cell) => cell.classList.remove("drag-over"));
        document.querySelectorAll(".touchpoint.dragging").forEach((element) => element.classList.remove("dragging"));
        document.body.classList.remove("is-dragging", "delete-active");
      }

      function handleCellDragOver(event) {
        if (!draggedId) {
          return;
        }

        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        document.body.classList.remove("delete-active");

        const cell = event.currentTarget;
        document.querySelectorAll(".touch-cell.drag-over").forEach((otherCell) => {
          if (otherCell !== cell) {
            otherCell.classList.remove("drag-over");
          }
        });
        cell.classList.add("drag-over");

        const afterElement = getElementAfterPointer(cell, event.clientY);
        const marker = getDropMarker();
        if (!afterElement) {
          cell.appendChild(marker);
        } else {
          cell.insertBefore(marker, afterElement);
        }
      }

      function handleCellDragLeave(event) {
        const cell = event.currentTarget;
        if (!cell.contains(event.relatedTarget)) {
          cell.classList.remove("drag-over");
        }
      }

      function handleCellDrop(event) {
        if (!draggedId) {
          return;
        }

        event.preventDefault();
        const cell = event.currentTarget;
        const orderedChildren = Array.from(cell.children).filter((child) => {
          return child.id === "dropMarker" || (child.classList.contains("touchpoint") && !child.classList.contains("dragging"));
        });
        const markerIndex = Math.max(0, orderedChildren.indexOf(getDropMarker()));
        moveTouchpoint(draggedId, cell.dataset.section, cell.dataset.stage, markerIndex);
        handleDragEnd();
      }

      function getElementAfterPointer(container, pointerY) {
        const draggableElements = Array.from(container.querySelectorAll(".touchpoint:not(.dragging)"));

        return draggableElements.reduce((closest, child) => {
          const box = child.getBoundingClientRect();
          const offset = pointerY - box.top - box.height / 2;
          if (offset < 0 && offset > closest.offset) {
            return {
              offset,
              element: child
            };
          }
          return closest;
        }, {
          offset: Number.NEGATIVE_INFINITY,
          element: null
        }).element;
      }

      function getDropMarker() {
        if (!dropMarker) {
          dropMarker = document.createElement("div");
          dropMarker.className = "drop-marker";
          dropMarker.id = "dropMarker";
        }
        return dropMarker;
      }

      function clearDropMarker() {
        if (dropMarker && dropMarker.parentElement) {
          dropMarker.parentElement.removeChild(dropMarker);
        }
      }

      function moveTouchpoint(id, nextSection, nextStage, nextOrder) {
        const touchpoint = state.touchpoints.find((candidate) => candidate.id === id);
        if (!touchpoint) {
          return;
        }

        touchpoint.section = nextSection;
        touchpoint.stage = nextStage;

        const peers = state.touchpoints
          .filter((candidate) => candidate.section === nextSection && candidate.stage === nextStage && candidate.id !== id)
          .sort((a, b) => a.order - b.order);

        peers.splice(Math.min(nextOrder, peers.length), 0, touchpoint);
        peers.forEach((peer, index) => {
          peer.order = index;
        });

        queueTouchpointFlash(id, "moved");
        saveState("Saved");
        renderTouchpoints();
      }

      function handleDeleteDragOver(event) {
        if (!draggedId) {
          return;
        }

        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        clearDropMarker();
        document.querySelectorAll(".touch-cell.drag-over").forEach((cell) => cell.classList.remove("drag-over"));
        document.body.classList.add("delete-active");
      }

      function handleDeleteDragLeave(event) {
        if (!event.currentTarget.contains(event.relatedTarget)) {
          document.body.classList.remove("delete-active");
        }
      }

      function handleDeleteDrop(event) {
        if (!draggedId) {
          return;
        }

        event.preventDefault();
        deleteDraggedTouchpoint();
      }

      function handleDocumentDragOver(event) {
        if (!draggedId || !isPointerInsideDeleteZone(event)) {
          return;
        }

        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        clearDropMarker();
        document.querySelectorAll(".touch-cell.drag-over").forEach((cell) => cell.classList.remove("drag-over"));
        document.body.classList.add("delete-active");
      }

      function handleDocumentDrop(event) {
        if (!draggedId || !isPointerInsideDeleteZone(event)) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        deleteDraggedTouchpoint();
      }

      function isPointerInsideDeleteZone(event) {
        const zone = document.getElementById("deleteZone");
        const rect = zone.getBoundingClientRect();
        return event.clientX >= rect.left &&
          event.clientX <= rect.right &&
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom;
      }

      function deleteDraggedTouchpoint() {
        state.touchpoints = state.touchpoints.filter((touchpoint) => touchpoint.id !== draggedId);
        saveState("Deleted");
        renderTouchpoints();
        handleDragEnd();
      }

      function addTouchpoint(section) {
        const number = state.nextTouchpointNumber;
        const stage = "discover";
        const touchpoint = {
          id: `tp-custom-${Date.now()}-${number}`,
          section,
          stage,
          text: `Touchpoint ${number}`,
          order: getTouchpoints(section, stage).length
        };

        state.nextTouchpointNumber += 1;
        state.touchpoints.push(touchpoint);
        queueTouchpointFlash(touchpoint.id, "added");
        saveState("Added");
        renderTouchpoints();
      }

      function queueTouchpointFlash(id, kind) {
        flashTouchpointId = id;
        flashTouchpointKind = kind;
      }

      function startEditingPersona() {
        const currentPersona = state.persona;
        const editor = document.createElement("input");
        editor.className = "persona-editor";
        editor.type = "text";
        editor.value = currentPersona;
        editor.maxLength = 120;
        editor.setAttribute("aria-label", "Persona name");

        personaValue.replaceWith(editor);

        let complete = false;
        const finish = (shouldSave) => {
          if (complete) {
            return;
          }
          complete = true;

          if (shouldSave) {
            state.persona = editor.value.trim() || "Generic Developer";
            saveState("Saved");
          }

          editor.replaceWith(personaValue);
          renderPersona();
        };

        editor.addEventListener("blur", () => finish(true), { once: true });
        editor.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            finish(false);
          }

          if (event.key === "Enter") {
            event.preventDefault();
            editor.blur();
          }
        });

        window.requestAnimationFrame(() => {
          editor.focus();
          editor.select();
        });
      }

      function startEditing(element, id) {
        const touchpoint = state.touchpoints.find((candidate) => candidate.id === id);
        if (!touchpoint || element.classList.contains("editing")) {
          return;
        }

        element.draggable = false;
        element.classList.add("editing");
        element.replaceChildren();

        const editor = document.createElement("textarea");
        editor.className = "touchpoint-editor";
        editor.value = touchpoint.text;
        editor.rows = Math.min(5, Math.max(1, touchpoint.text.split("\n").length));
        element.appendChild(editor);

        let complete = false;
        const finish = (shouldSave) => {
          if (complete) {
            return;
          }
          complete = true;

          if (shouldSave) {
            const nextText = editor.value.trim().replace(/\r\n/g, "\n");
            touchpoint.text = nextText || "Untitled touchpoint";
            saveState("Saved");
          }

          renderTouchpoints();
        };

        editor.addEventListener("blur", () => finish(true), { once: true });
        editor.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            finish(false);
          }

          if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
            event.preventDefault();
            editor.blur();
          }
        });
        editor.addEventListener("input", () => autoSizeEditor(editor));

        window.requestAnimationFrame(() => {
          editor.focus();
          editor.select();
          autoSizeEditor(editor);
        });
      }

      function autoSizeEditor(editor) {
        editor.style.height = "auto";
        editor.style.height = `${Math.max(28, editor.scrollHeight)}px`;
      }

      function exportToFile() {
        saveState("Exported");
        const raw = readLocalStorage() || JSON.stringify(state, null, 2);
        const blob = new Blob([raw], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "developer-journey-map.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 250);
      }

      async function downloadPng() {
        await document.fonts.ready;

        const source = document.querySelector(".app-shell");
        document.body.classList.add("is-rendering-png");
        setStatus("Rendering PNG");

        try {
          await nextFrame();
          const mapGridWidth = mapGrid.scrollWidth + 36;
          const width = Math.ceil(Math.max(source.scrollWidth, document.documentElement.scrollWidth, mapGridWidth));
          const height = Math.ceil(Math.max(source.scrollHeight, document.documentElement.scrollHeight));
          const canvas = renderJourneyMapCanvas(source, width, height);
          const pngBlob = await canvasToBlob(canvas);
          triggerDownload(pngBlob, "developer-journey-map.png");
          setStatus("PNG downloaded");
        } catch (error) {
          setStatus("PNG failed");
        } finally {
          document.body.classList.remove("is-rendering-png");
        }
      }

      function renderJourneyMapCanvas(root, width, height) {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const context = canvas.getContext("2d");
        drawPageBackground(context, width, height);
        const origin = root.getBoundingClientRect();
        const bounds = (element) => {
          const rect = element.getBoundingClientRect();
          return {
            x: rect.left - origin.left,
            y: rect.top - origin.top,
            width: rect.width,
            height: rect.height
          };
        };

        drawSideRail(context, bounds);
        drawToolbar(context, bounds);
        drawStagePills(context, bounds);
        drawTouchpoints(context, bounds);
        drawJourneyDivider(context, bounds, width);
        drawSideLabels(context, bounds);
        drawQuestionMarkers(context, bounds);
        drawTextNodes(context, root, origin);

        return canvas;
      }

      function cssVar(name, fallback) {
        return getComputedStyle(document.body).getPropertyValue(name).trim() || fallback;
      }

      function drawPageBackground(context, width, height) {
        const gradient = context.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, cssVar("--canvas-bg-start", "#ffffff"));
        gradient.addColorStop(1, cssVar("--canvas-bg-end", "#f7f7f4"));
        context.fillStyle = gradient;
        context.fillRect(0, 0, width, height);

        context.strokeStyle = cssVar("--texture-line", "rgba(0, 0, 0, 0.018)");
        context.lineWidth = 1;
        for (let y = 0; y < height; y += 5) {
          context.beginPath();
          context.moveTo(0, y + 0.5);
          context.lineTo(width, y + 0.5);
          context.stroke();
        }
      }

      function drawToolbar(context, bounds) {
        document.querySelectorAll(".control-button").forEach((button) => {
          if (!isElementRenderable(button)) {
            return;
          }

          const rect = bounds(button);
          const style = getComputedStyle(button);
          drawRoundedRect(context, rect.x, rect.y + 2, rect.width, rect.height, 8, {
            fill: style.borderTopColor || cssVar("--line", "#050505")
          });
          drawRoundedRect(context, rect.x, rect.y, rect.width, rect.height, 8, {
            fill: style.backgroundColor || cssVar("--control-surface", "#ffffff"),
            stroke: style.borderTopColor || cssVar("--line", "#050505"),
            lineWidth: 2
          });
        });
      }

      function drawSideRail(context, bounds) {
        const rail = bounds(document.getElementById("deleteZone"));
        const gradient = context.createLinearGradient(rail.x, rail.y, rail.x + rail.width, rail.y);
        gradient.addColorStop(0, cssVar("--rail", "#bfc0c2"));
        gradient.addColorStop(1, cssVar("--rail-dark", "#aeb0b3"));
        drawRoundedRect(context, rail.x, rail.y, rail.width, rail.height, 10, {
          fill: gradient,
          stroke: cssVar("--line", "#050505"),
          lineWidth: 3
        });
      }

      function drawSideLabels(context, bounds) {
        document.querySelectorAll(".add-button").forEach((button) => {
          if (!isElementRenderable(button)) {
            return;
          }

          const rect = bounds(button);
          const style = getComputedStyle(button);
          drawRoundedRect(context, rect.x, rect.y + 2, rect.width, rect.height, rect.width / 2, {
            fill: style.borderTopColor || cssVar("--line", "#050505")
          });
          drawRoundedRect(context, rect.x, rect.y, rect.width, rect.height, rect.width / 2, {
            fill: style.backgroundColor || cssVar("--control-surface", "#ffffff"),
            stroke: style.borderTopColor || cssVar("--line", "#050505"),
            lineWidth: 2
          });
        });
      }

      function drawStagePills(context, bounds) {
        document.querySelectorAll(".stage-pill").forEach((pill) => {
          const rect = bounds(pill);
          const notch = 48;
          const style = getComputedStyle(pill);
          context.save();
          context.fillStyle = style.backgroundColor || cssVar("--stage-fill", "#000000");
          context.beginPath();
          context.moveTo(rect.x + 8, rect.y);
          context.lineTo(rect.x + rect.width - notch, rect.y);
          context.lineTo(rect.x + rect.width, rect.y + rect.height / 2);
          context.lineTo(rect.x + rect.width - notch, rect.y + rect.height);
          context.lineTo(rect.x + 8, rect.y + rect.height);
          context.quadraticCurveTo(rect.x, rect.y + rect.height, rect.x, rect.y + rect.height - 8);
          context.lineTo(rect.x, rect.y + 8);
          context.quadraticCurveTo(rect.x, rect.y, rect.x + 8, rect.y);
          context.closePath();
          context.fill();
          context.restore();
        });
      }

      function drawQuestionMarkers(context, bounds) {
        document.querySelectorAll(".question-cell").forEach((cell) => {
          cell.querySelectorAll("li").forEach((item, index) => {
            const rect = bounds(item);
            const style = getComputedStyle(item);
            context.font = `${style.fontStyle} ${style.fontVariant} 900 ${style.fontSize} ${style.fontFamily}`;
            context.textBaseline = "top";
            context.fillStyle = style.color || "#050505";
            context.fillText(`${index + 1}.`, rect.x - 30, rect.y + 1);
          });
        });
      }

      function drawTouchpoints(context, bounds) {
        document.querySelectorAll(".touchpoint").forEach((touchpoint) => {
          const rect = bounds(touchpoint);
          const style = getComputedStyle(touchpoint);
          let fill = style.backgroundColor || cssVar("--touchpoint-bg", "#ffffff");
          if (touchpoint.classList.contains("flash-added")) {
            fill = "#d7ecff";
          } else if (touchpoint.classList.contains("flash-moved")) {
            fill = "#d9f6dc";
          }

          drawRoundedRect(context, rect.x, rect.y, rect.width, rect.height, 8, {
            fill,
            stroke: style.borderTopColor || cssVar("--line", "#050505"),
            lineWidth: 1.8
          });
        });
      }

      function drawJourneyDivider(context, bounds, width) {
        const divider = bounds(document.querySelector(".journey-divider"));
        const y = divider.y + 12;
        context.save();
        context.strokeStyle = cssVar("--line", "#050505");
        context.lineWidth = 5;
        context.setLineDash([18, 10]);
        context.lineCap = "round";
        context.beginPath();
        context.moveTo(40, y);
        context.lineTo(width - 78, y);
        context.stroke();
        context.setLineDash([]);
        context.fillStyle = cssVar("--line", "#050505");
        context.beginPath();
        context.moveTo(width - 50, y - 14);
        context.lineTo(width, y);
        context.lineTo(width - 50, y + 14);
        context.closePath();
        context.fill();
        context.restore();
      }

      function drawTextNodes(context, root, origin) {
        const range = document.createRange();
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            if (!node.nodeValue || node.nodeValue.trim().length === 0) {
              return NodeFilter.FILTER_REJECT;
            }

            const element = node.parentElement;
            if (!element || element.closest("script, style, .visually-hidden")) {
              return NodeFilter.FILTER_REJECT;
            }

            if (!isElementRenderable(element)) {
              return NodeFilter.FILTER_REJECT;
            }

            return NodeFilter.FILTER_ACCEPT;
          }
        });

        let node = walker.nextNode();
        while (node) {
          const element = node.parentElement;
          const style = getComputedStyle(element);
          applyTextStyle(context, element);

          const pattern = /\S+/g;
          let match = pattern.exec(node.nodeValue);
          while (match) {
            drawTextRun(context, node, match.index, match.index + match[0].length, style, origin, range);
            match = pattern.exec(node.nodeValue);
          }

          node = walker.nextNode();
        }
      }

      function drawTextRun(context, node, startOffset, endOffset, style, origin, range) {
        range.setStart(node, startOffset);
        range.setEnd(node, endOffset);
        const rects = getVisibleClientRects(range);
        if (rects.length === 0) {
          return;
        }

        if (rects.length === 1) {
          const rect = rects[0];
          const text = transformText(node.nodeValue.slice(startOffset, endOffset), style.textTransform);
          context.fillText(text, rect.left - origin.left, rect.top - origin.top);
          return;
        }

        const fragments = splitTextRunByClientRects(node, startOffset, endOffset, rects, range);
        fragments.forEach((fragment) => {
          const text = transformText(fragment.text, style.textTransform);
          context.fillText(text, fragment.rect.left - origin.left, fragment.rect.top - origin.top);
        });
      }

      function splitTextRunByClientRects(node, startOffset, endOffset, rects, range) {
        const fragments = rects.map((rect) => ({ rect, text: "" }));
        const sourceText = node.nodeValue;
        let offset = startOffset;

        while (offset < endOffset) {
          const nextOffset = getNextTextOffset(sourceText, offset);
          range.setStart(node, offset);
          range.setEnd(node, nextOffset);
          const characterRect = getVisibleClientRects(range)[0];
          const fragmentIndex = characterRect ? findTextFragmentIndex(characterRect, rects) : -1;
          if (fragmentIndex >= 0) {
            fragments[fragmentIndex].text += sourceText.slice(offset, nextOffset);
          }
          offset = nextOffset;
        }

        return fragments.filter((fragment) => fragment.text.length > 0);
      }

      function findTextFragmentIndex(characterRect, rects) {
        let bestIndex = -1;
        let bestScore = Infinity;

        rects.forEach((rect, index) => {
          const overlapsLine = characterRect.bottom >= rect.top - 1 && characterRect.top <= rect.bottom + 1;
          if (!overlapsLine) {
            return;
          }

          const overlap = Math.min(characterRect.right, rect.right) - Math.max(characterRect.left, rect.left);
          const horizontalDistance = overlap >= -1
            ? 0
            : Math.min(Math.abs(characterRect.left - rect.right), Math.abs(characterRect.right - rect.left));
          const score = Math.abs(characterRect.top - rect.top) + horizontalDistance;

          if (score < bestScore) {
            bestScore = score;
            bestIndex = index;
          }
        });

        return bestIndex;
      }

      function getVisibleClientRects(range) {
        return Array.from(range.getClientRects()).filter((rect) => rect.width > 0 && rect.height > 0);
      }

      function getNextTextOffset(text, offset) {
        const codePoint = text.codePointAt(offset);
        if (!Number.isFinite(codePoint)) {
          return offset + 1;
        }
        return offset + String.fromCodePoint(codePoint).length;
      }

      function isElementRenderable(element) {
        let current = element;
        while (current && current.nodeType === Node.ELEMENT_NODE) {
          const style = getComputedStyle(current);
          if (style.display === "none" || style.visibility === "hidden" || Number(style.opacity) === 0) {
            return false;
          }
          current = current.parentElement;
        }
        return true;
      }

      function transformText(text, transform) {
        if (transform === "uppercase") {
          return text.toUpperCase();
        }
        if (transform === "lowercase") {
          return text.toLowerCase();
        }
        if (transform === "capitalize") {
          return text.replace(/\b\p{L}/gu, (character) => character.toUpperCase());
        }
        return text;
      }

      function drawTextElement(context, element, bounds, options = {}) {
        if (!element) {
          return;
        }

        const rect = bounds(element);
        const style = getComputedStyle(element);
        const lineHeight = parseLineHeight(style);
        applyTextStyle(context, element);

        const x = options.x ?? rect.x;
        const maxWidth = options.maxWidth ?? rect.width;
        let y = options.y ?? rect.y;

        if (options.vertical === "middle") {
          const fontSize = parsePx(style.fontSize);
          y = rect.y + Math.max(0, (rect.height - fontSize) / 2);
        }

        drawWrappedText(context, element.innerText || element.textContent, x, y, maxWidth, lineHeight, options.align || style.textAlign || "left");
      }

      function drawWrappedText(context, text, x, y, maxWidth, lineHeight, align) {
        const paragraphs = String(text || "")
          .replace(/\r\n/g, "\n")
          .split("\n");
        let cursorY = y;

        paragraphs.forEach((paragraph, paragraphIndex) => {
          const words = paragraph.trim().split(/\s+/).filter(Boolean);
          const lines = [];

          if (words.length === 0) {
            lines.push("");
          } else {
            let line = words[0];
            for (let index = 1; index < words.length; index += 1) {
              const candidate = `${line} ${words[index]}`;
              if (context.measureText(candidate).width <= maxWidth) {
                line = candidate;
              } else {
                lines.push(line);
                line = words[index];
              }
            }
            lines.push(line);
          }

          lines.forEach((line) => {
            let drawX = x;
            if (align === "center") {
              drawX = x + (maxWidth - context.measureText(line).width) / 2;
            } else if (align === "right" || align === "end") {
              drawX = x + maxWidth - context.measureText(line).width;
            }
            context.fillText(line, drawX, cursorY);
            cursorY += lineHeight;
          });

          if (paragraphIndex < paragraphs.length - 1 && words.length === 0) {
            cursorY += lineHeight;
          }
        });
      }

      function applyTextStyle(context, element) {
        const style = getComputedStyle(element);
        context.fillStyle = style.color || "#050505";
        context.textBaseline = "top";
        context.font = `${style.fontStyle} ${style.fontVariant} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
      }

      function parseLineHeight(style) {
        const lineHeight = parseFloat(style.lineHeight);
        if (Number.isFinite(lineHeight)) {
          return lineHeight;
        }
        return parsePx(style.fontSize) * 1.16;
      }

      function parsePx(value) {
        const parsed = parseFloat(value);
        return Number.isFinite(parsed) ? parsed : 16;
      }

      function drawRoundedRect(context, x, y, width, height, radius, options = {}) {
        const safeRadius = Math.min(radius, width / 2, height / 2);
        context.save();
        context.beginPath();
        context.moveTo(x + safeRadius, y);
        context.lineTo(x + width - safeRadius, y);
        context.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
        context.lineTo(x + width, y + height - safeRadius);
        context.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height);
        context.lineTo(x + safeRadius, y + height);
        context.quadraticCurveTo(x, y + height, x, y + height - safeRadius);
        context.lineTo(x, y + safeRadius);
        context.quadraticCurveTo(x, y, x + safeRadius, y);
        context.closePath();
        if (options.fill) {
          context.fillStyle = options.fill;
          context.fill();
        }
        if (options.stroke) {
          context.strokeStyle = options.stroke;
          context.lineWidth = options.lineWidth || 1;
          context.stroke();
        }
        context.restore();
      }

      function canvasToBlob(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) {
              resolve(blob);
              return;
            }
            reject(new Error("Unable to render PNG."));
          }, "image/png");
        });
      }

      function nextFrame() {
        return new Promise((resolve) => {
          window.requestAnimationFrame(() => resolve());
        });
      }

      function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 250);
      }

      function resetToDefault() {
        const confirmed = window.confirm("Reset this journey map to the default Generic Developer version?");
        if (!confirmed) {
          setStatus("Reset canceled");
          return;
        }

        applyImportedState(cloneState(DEFAULT_STATE), "Reset");
      }

      function importFromFile(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }

        const reader = new FileReader();
        reader.addEventListener("load", () => {
          try {
            const parsed = JSON.parse(String(reader.result || ""));
            const result = validateState(parsed);
            if (!result.valid) {
              setStatus(`Import failed: ${result.errors[0]}`);
              return;
            }

            applyImportedState(result.value, "Imported");
          } catch (error) {
            setStatus("Import failed: invalid JSON.");
          } finally {
            importFile.value = "";
          }
        });
        reader.addEventListener("error", () => {
          setStatus("Import failed");
          importFile.value = "";
        });
        reader.readAsText(file);
      }

      function applyImportedState(nextState, message) {
        const result = validateState(nextState);
        if (!result.valid) {
          setStatus(`${message} failed: ${result.errors[0]}`);
          return;
        }

        state = result.value;
        renderPersona();
        renderQuestionRows();
        saveState(message);
        renderTouchpoints();
      }

      function setStatus(message) {
        window.clearTimeout(statusTimer);
        statusEl.textContent = message;
        if (message !== "Ready") {
          statusTimer = window.setTimeout(() => {
            statusEl.textContent = "Saved";
          }, 1800);
        }
      }

      function cloneState(value) {
        return JSON.parse(JSON.stringify(value));
      }
    })();
  </script>
</body>
</html>
